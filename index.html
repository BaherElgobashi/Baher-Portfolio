<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baher Mohamed | Backend Software Engineer (.NET)</title>
<meta name="description" content="Portfolio of Baher Mohamed, a backend software engineer building scalable ASP.NET Core APIs, with full-stack delivery in React.js.">
<meta name="theme-color" content="#07061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07061a; --bg2:#0d0b29; --indigo:#6366f1; --deep:#312e81; --pink:#ff2e93; --cyan:#22d3ee; --amber:#fbbf24;
  --text:#e9e8ff; --muted:#9a98c4; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
  --grad:linear-gradient(90deg,var(--indigo),var(--pink),var(--amber),var(--cyan),var(--indigo));
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;scrollbar-color:var(--pink) var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Syne',sans-serif;line-height:1.15}
a{color:inherit;text-decoration:none}
img,svg{max-width:100%}
::selection{background:var(--pink);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--indigo),var(--pink));border-radius:10px;border:2px solid var(--bg)}
/* noise overlay */
body::after{content:"";position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.container{width:min(1180px,92%);margin-inline:auto}
main>section{position:relative;z-index:2;padding:110px 0}
.sec-head{margin-bottom:56px}
.sec-head h2{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800}
.sec-head h2::after{content:"";display:block;width:72px;height:4px;margin-top:16px;border-radius:4px;background:var(--grad);background-size:300%;animation:shimmer 4s linear infinite}
.sec-head p{color:var(--muted);margin-top:14px;max-width:56ch}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
/* scroll reveal */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s ease var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.reveal.left{transform:translateX(-70px)}
.reveal.right{transform:translateX(70px)}
.reveal.in{opacity:1;transform:none}
@keyframes shimmer{to{background-position:300% center}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
/* ===== Loader ===== */
#loader{position:fixed;inset:0;z-index:10000;background:radial-gradient(circle at 50% 40%,#15123f,var(--bg) 70%);display:grid;place-content:center;justify-items:center;gap:28px;transition:opacity .7s ease,visibility .7s}
#loader.hide{opacity:0;visibility:hidden}
.ld-init{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(64px,14vw,120px);line-height:1;letter-spacing:-.02em;background:var(--grad);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.4s linear infinite}
.ld-bar{width:min(260px,70vw);height:4px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.ld-bar span{display:block;height:100%;width:0;background:var(--grad);background-size:300%;animation:ldfill 1.9s cubic-bezier(.6,.1,.3,1) forwards,shimmer 1.2s linear infinite}
@keyframes ldfill{to{width:100%}}
/* ===== Cursor ===== */
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;pointer-events:none;z-index:10001;border-radius:50%;opacity:0;transition:opacity .3s}
.cursor-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--cyan);box-shadow:0 0 12px 3px var(--cyan),0 0 32px 6px rgba(255,46,147,.6)}
.cursor-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid rgba(255,46,147,.75);transition:opacity .3s,width .25s,height .25s,margin .25s,background .25s,border-color .25s}
.cursor-ring.hover{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(255,46,147,.1);border-color:var(--cyan)}
@media (hover:hover) and (pointer:fine){html,body,a,button{cursor:none}}
@media (hover:none),(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}
/* ===== Particle canvas ===== */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/*@CSS*/
</style>
</head>
<body>
<div id="loader" aria-hidden="true"><div class="ld-init">BM</div><div class="ld-bar"><span></span></div></div>
<div class="cursor-dot"></div><div class="cursor-ring"></div>
<canvas id="bg" aria-hidden="true"></canvas>
<!--@BODY-->
<script>
'use strict';
/* ---------- Scroll reveal (fade up / slide left / slide right) ---------- */
const revealIO = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealIO.unobserve(e.target); } });
},{threshold:.15, rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach(el=>revealIO.observe(el));

/* ---------- Loader ---------- */
window.addEventListener('load',()=>{
  setTimeout(()=>{ document.getElementById('loader').classList.add('hide'); document.body.classList.add('loaded'); },2000);
});

/* ---------- Custom cursor: glowing dot + trailing ring ---------- */
(()=>{
  const dot=document.querySelector('.cursor-dot'), ring=document.querySelector('.cursor-ring');
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my;
  addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; dot.style.opacity=ring.style.opacity=1; dot.style.transform=`translate(${mx}px,${my}px)`; });
  document.addEventListener('mouseleave',()=>{dot.style.opacity=ring.style.opacity=0});
  (function loop(){ rx+=(mx-rx)*.14; ry+=(my-ry)*.14; ring.style.transform=`translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
  document.addEventListener('mouseover',e=>{ ring.classList.toggle('hover',!!e.target.closest('a,button,.chip,.proj,.tl-card,.info-card')); });
})();

/* ---------- Particle network ---------- */
(()=>{
  const c=document.getElementById('bg'), x=c.getContext('2d');
  const cols=['#6366f1','#ff2e93','#22d3ee','#fbbf24'];
  let W,H,P=[]; const m={x:-999,y:-999}, LINK=135;
  function init(){
    const d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    c.width=W*d; c.height=H*d; x.setTransform(d,0,0,d,0,0);
    const n=Math.min(120,Math.floor(W*H/13000));
    P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.55,vy:(Math.random()-.5)*.55,r:Math.random()*1.8+.8,c:cols[Math.random()*cols.length|0]}));
  }
  addEventListener('resize',init);
  addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});
  function tick(){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      x.globalAlpha=.9; x.fillStyle=p.c; x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill();
    }
    for(let i=0;i<P.length;i++){
      const a=P[i];
      for(let j=i+1;j<P.length;j++){
        const b=P[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy);
        if(d<LINK){ x.globalAlpha=(1-d/LINK)*.38; x.strokeStyle=a.c; x.lineWidth=.8; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
      }
      const dm=Math.hypot(a.x-m.x,a.y-m.y);
      if(dm<170){ x.globalAlpha=(1-dm/170)*.55; x.strokeStyle='#22d3ee'; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(m.x,m.y); x.stroke(); }
    }
    requestAnimationFrame(tick);
  }
  init(); tick();
})();
//@JS
</script>
</body>
</html>
